name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'php-*'
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build (e.g. 8.4)'
        required: false
        default: '8.4'
      publish_fpm:
        description: 'Also publish the legacy PHP-FPM + Caddy image'
        type: boolean
        required: false
        default: false

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DEFAULT_PHP_VERSION: '8.4'
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/php-base
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/php-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine PHP version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/php-* ]]; then
            echo "PHP_VERSION=${GITHUB_REF#refs/tags/php-}" >> "$GITHUB_ENV"
          elif [[ -n "${{ github.event.inputs.php_version }}" ]]; then
            echo "PHP_VERSION=${{ github.event.inputs.php_version }}" >> "$GITHUB_ENV"
          else
            echo "PHP_VERSION=${{ env.DEFAULT_PHP_VERSION }}" >> "$GITHUB_ENV"
          fi

      - name: Set publish options
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish_fpm }}" == "true" ]]; then
            echo "publish_fpm=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "publish_fpm=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_fpm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          TAGS="${{ env.GHCR_IMAGE }}:php-${PHP_VERSION}
          ${{ env.DOCKERHUB_IMAGE }}:php-${PHP_VERSION}"
          if [ "${PHP_VERSION}" = "${{ env.DEFAULT_PHP_VERSION }}" ]; then
            TAGS="${TAGS}
          ${{ env.GHCR_IMAGE }}:latest
          ${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push FrankenPHP Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-base.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
          cache-from: type=gha,scope=frankenphp-alpine
          cache-to: type=gha,mode=max,scope=frankenphp-alpine

      - name: Build and push FrankenPHP Debian image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-base-debian.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE }}:php-${{ env.PHP_VERSION }}-debian
            ${{ env.DOCKERHUB_IMAGE }}:php-${{ env.PHP_VERSION }}-debian
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
          cache-from: type=gha,scope=frankenphp-debian
          cache-to: type=gha,mode=max,scope=frankenphp-debian

      - name: Build and push legacy FPM image
        if: steps.publish.outputs.publish_fpm == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-base-fpm.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE }}:php-${{ env.PHP_VERSION }}-fpm
            ${{ env.DOCKERHUB_IMAGE }}:php-${{ env.PHP_VERSION }}-fpm
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
          cache-from: type=gha,scope=fpm
          cache-to: type=gha,mode=max,scope=fpm
