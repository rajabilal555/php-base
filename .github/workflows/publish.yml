name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'php-*'
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build (e.g. 8.4)'
        required: false
        default: '8.4'
      publish_fpm:
        description: 'Also publish the legacy PHP-FPM + Caddy image'
        type: boolean
        required: false
        default: false

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PHP_VERSION: '8.4'
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/php-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine PHP version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/php-* ]]; then
            echo "PHP_VERSION=${GITHUB_REF#refs/tags/php-}" >> "$GITHUB_ENV"
          elif [[ -n "${{ github.event.inputs.php_version }}" ]]; then
            echo "PHP_VERSION=${{ github.event.inputs.php_version }}" >> "$GITHUB_ENV"
          fi

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          tags="${IMAGE_NAME}:php-${PHP_VERSION}
          ${IMAGE_NAME}:latest"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish_fpm }}" == "true" ]]; then
            echo "publish_fpm=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "publish_fpm=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_fpm=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "frankenphp<<EOF"
            echo "$tags"
            echo "EOF"
            echo "fpm<<EOF"
            echo "${IMAGE_NAME}:php-${PHP_VERSION}-fpm"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push FrankenPHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-base.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.frankenphp }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}

      - name: Build and push legacy FPM image
        if: steps.tags.outputs.publish_fpm == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-base-fpm.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.fpm }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}

      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FrankenPHP image to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-base.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/php-base:php-${{ env.PHP_VERSION }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/php-base:latest
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}

      - name: Build and push legacy FPM image to Docker Hub
        if: steps.tags.outputs.publish_fpm == 'true' && steps.dockerhub-login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-base-fpm.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/php-base:php-${{ env.PHP_VERSION }}-fpm
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
