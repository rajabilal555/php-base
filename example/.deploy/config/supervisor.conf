[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
nodaemon=true
pidfile=/tmp/supervisord.pid

[program:frankenphp]
command=/usr/local/bin/frankenphp run --config %(ENV_LARAVEL_PATH)s/.deploy/config/Caddyfile
directory=%(ENV_LARAVEL_PATH)s
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:supercronic]
command=/usr/local/bin/supercronic -quiet -overlapping %(ENV_LARAVEL_PATH)s/.deploy/config/crontab
directory=%(ENV_LARAVEL_PATH)s
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue]
command=php %(ENV_LARAVEL_PATH)s/artisan queue:work --sleep=3 --tries=3 --max-jobs=500 --max-time=3600
directory=%(ENV_LARAVEL_PATH)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

